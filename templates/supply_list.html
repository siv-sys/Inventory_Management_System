<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suppliers List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

    <div class="max-w-7xl mx-auto bg-white p-6 rounded shadow">

        <!-- Header -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold">Suppliers List</h2>
            <div class="">
                <button onclick="back()"
                    class="bg-cyan-500 text-white px-4 py-2 rounded hover:bg-cyan-600">back</button>
                <button onclick="openAddModal()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Add
                    Supplier</button>
            </div>
        </div>

        <!-- Search -->
        <input type="text" id="searchInput" onkeyup="searchTable()" placeholder="Search suppliers..."
            class="mb-4 p-2 border rounded w-full" />

        <!-- Suppliers Table -->
        <div class="overflow-x-auto">
            <table id="suppliersTable" class="min-w-full border-collapse border border-gray-200">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="border px-4 py-2">#</th>
                        <th class="border px-4 py-2">Supplier Name</th>
                        <th class="border px-4 py-2">Phone</th>
                        <th class="border px-4 py-2">Address</th>
                        <th class="border px-4 py-2">Status</th>
                        <th class="border px-4 py-2">Actions</th>
                    </tr>
                </thead>
                <tbody id="suppliersBody">
                    <!-- Example Data -->
                    {%for item in supplys%}
                    <tr data-id="{{item.supplyid}}">
                        <td class="border px-4 py-2"> {{item.supplyid}} </td>
                        <td class="border px-4 py-2"> {{item.nickname}} </td>
                        <td class="border px-4 py-2"> {{item.phone}} </td>
                        <td class="border px-4 py-2"> {{item.address}} </td>
                        <td class="border px-4 py-2">
                            {%if item.disabled == 0 %}
                            <span class="text-green-600 font-bold">Active</span>
                            {%else%}
                            <span class="text-red-600 font-bold">InActive</span>
                            {%endif%}
                        </td>
                        <td class="border px-4 py-2">
                            <button class="text-blue-500 hover:underline" onclick="openEditModal(this)">Edit</button> |
                            <button class="text-red-500 hover:underline" onclick="deleteRow(this)">Delete</button>
                        </td>
                    </tr>
                    {%endfor%}
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add / Edit Modal -->
    <!-- Add / Edit Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md mx-2 relative">
            <!-- Close Button -->
            <button onclick="closeModal()"
                class="absolute top-2 right-2 text-gray-500 hover:text-gray-700">&times;</button>

            <h3 id="modalTitle" class="text-xl font-bold mb-4">Add Supplier</h3>
            <form id="supplierForm" onsubmit="saveSupplier(event)">
                <div class="mb-3">
                    <label class="block mb-1">Supplier Name</label>
                    <input type="text" id="supplierName" class="w-full border p-2 rounded" required>
                </div>
                <div class="mb-3">
                    <label class="block mb-1">Contact Person</label>
                    <input type="text" id="contactPerson" class="w-full border p-2 rounded" required>
                </div>
                <div class="mb-3">
                    <label class="block mb-1">Email</label>
                    <input type="email" id="email" class="w-full border p-2 rounded" required>
                </div>
                <div class="mb-3">
                    <label class="block mb-1">Phone</label>
                    <input type="text" id="phone" class="w-full border p-2 rounded" required>
                </div>
                <div class="mb-3">
                    <label class="block mb-1">Address</label>
                    <input type="text" id="address" class="w-full border p-2 rounded" required>
                </div>
                <div class="mb-4">
                    <label class="block mb-1">Status</label>
                    <select id="status" class="w-full border p-2 rounded">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeModal()"
                        class="px-4 py-2 border rounded hover:bg-gray-100">Cancel</button>
                    <button type="submit"
                        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Save</button>
                </div>
            </form>
        </div>
    </div>


    <!-- Scripts -->
    <script>
        let editingRow = null;

        const supplyId = row.getAttribute('data-id');

        function back() {
            window.history.back();
        }

        function openAddModal() {
            editingRow = null;
            document.getElementById('modalTitle').textContent = 'Add Supplier';
            document.getElementById('supplierForm').reset();
            document.getElementById('modal').classList.remove('hidden');
        }

        function openEditModal(btn) {
            editingRow = btn.closest('tr');
            document.getElementById('modalTitle').textContent = 'Edit Supplier';
            document.getElementById('supplierName').value = editingRow.cells[1].textContent;
            document.getElementById('contactPerson').value = editingRow.cells[2].textContent;
            document.getElementById('email').value = editingRow.cells[3].textContent;
            document.getElementById('phone').value = editingRow.cells[4].textContent;
            document.getElementById('address').value = editingRow.cells[5].textContent;
            document.getElementById('status').value = editingRow.cells[6].textContent.trim();
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function saveSupplier(event) {
            event.preventDefault();
            const name = document.getElementById('supplierName').value;
            const contact = document.getElementById('contactPerson').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const status = document.getElementById('status').value;

            if (editingRow) {
                editingRow.cells[1].textContent = name;
                editingRow.cells[2].textContent = contact;
                editingRow.cells[3].textContent = email;
                editingRow.cells[4].textContent = phone;
                editingRow.cells[5].textContent = address;
                editingRow.cells[6].innerHTML = status === 'Active' ?
                    '<span class="text-green-600 font-bold">Active</span>' :
                    '<span class="text-red-600 font-bold">Inactive</span>';
            } else {
                const table = document.getElementById('suppliersBody');
                const rowCount = table.rows.length + 1;
                const row = table.insertRow();
                row.innerHTML = `
                    <td class="border px-4 py-2">${rowCount}</td>
                    <td class="border px-4 py-2">${name}</td>
                    <td class="border px-4 py-2">${contact}</td>
                    <td class="border px-4 py-2">${email}</td>
                    <td class="border px-4 py-2">${phone}</td>
                    <td class="border px-4 py-2">${address}</td>
                    <td class="border px-4 py-2">${status === 'Active' ?
                        '<span class="text-green-600 font-bold">Active</span>' :
                        '<span class="text-red-600 font-bold">Inactive</span>'}</td>
                    <td class="border px-4 py-2">
                        <button class="text-blue-500 hover:underline" onclick="openEditModal(this)">Edit</button> |
                        <button class="text-red-500 hover:underline" onclick="deleteRow(this)">Delete</button>
                    </td>
                `;
            }

            closeModal();
        }

        function deleteRow(btn) {
            if (confirm('Are you sure you want to delete this supplier?')) {
                const row = btn.closest('tr');
                row.remove();
                // Re-number rows
                const table = document.getElementById('suppliersBody');
                Array.from(table.rows).forEach((r, i) => r.cells[0].textContent = i + 1);
                window.location.href = `/suppliers/remove/${supplyId}`;
            }
        }

        function searchTable() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.getElementById('suppliersBody').rows;
            for (let row of rows) {
                row.style.display = Array.from(row.cells).some(cell =>
                    cell.textContent.toLowerCase().includes(input)
                ) ? '' : 'none';
            }
        }
    </script>

</body>

</html>

{% extends "base.html" %}
{% block title %}User{% endblock %}

{% block content %}

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-md p-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-semibold text-gray-800">User List</h2>
            <div class="">
                <a href="{{url_for('dashboard')}}"
                    class="bg-gray-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition">
                    back to dashbaord</a>
                <a href="{{url_for('user_mgt.create_user')}}"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition">+
                    Add User</a>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">ID</th>
                        <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Name</th>
                        <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Email</th>
                        <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Role</th>
                        <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Status</th>
                        <th class="px-6 py-3 text-center text-sm font-semibold text-gray-700">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    {% for user in users %}
                    <!-- User Row -->
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 text-sm text-gray-600"> {{user.userid}} </td>
                        <td class="px-6 py-4 text-sm font-medium text-gray-800"> {{user.nickname}} </td>
                        <td class="px-6 py-4 text-sm text-gray-600"> {{user.email}} </td>
                        <td class="px-6 py-4 text-sm text-gray-600"> {{user.level}} </td>
                        <td class="px-6 py-4">
                            <span
                                class="inline-flex px-2 py-1 text-xs font-medium rounded-full bg-green-100 text-green-700">Active</span>
                        </td>
                        <td class="px-6 py-4 text-center space-x-2">
                            <a href="{{url_for('user_mgt.edit_user',id=user.userid)}}"
                                class="text-blue-600 hover:text-blue-800 text-sm font-medium">Edit</a>
                            <a href="{{url_for('user_mgt.disable_user',id=user.userid)}}" class="text-red-600 hover:text-red-800 text-sm font-medium">Delete</a>
                        </td>
                    </tr>
                    {%endfor%}
                </tbody>
            </table>
        </div>
    </div>

{% endblock %}

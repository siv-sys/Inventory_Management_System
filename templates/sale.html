{% extends "base.html" %}
{% block title %}Create Sale - Inventory System{% endblock %}

{% block content %}
<div class="mb-8">
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-gray-900">Create Sale</h1>
            <p class="text-gray-600">Add products to complete a new sale</p>
        </div>
    </div>
</div>

<form method="POST" class="bg-white shadow rounded-xl p-6 space-y-6">

    <!-- 🔍 Barcode / Product Code Input -->
    <div class="mb-4">
        <label for="barcodeSearch" class="block text-sm font-medium text-gray-700 mb-1">
            Scan or Enter Product Code
        </label>
        <input type="text" id="barcodeSearch"
            class="border border-gray-300 rounded-lg px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Scan or type product code and press Enter">
    </div>

    <!-- 🧾 Sale Items Table -->
    <div>
        <h2 class="text-lg font-semibold mb-2">Products</h2>
        <table class="min-w-full divide-y divide-gray-200 mb-4">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Code</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Product</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Price</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Available</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Quantity</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Subtotal</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="saleItemsBody" class="bg-white divide-y divide-gray-200">
                <!-- Rows are added dynamically -->
            </tbody>
        </table>
    </div>

    <!-- 💰 Total -->
    <div class="text-right text-xl font-bold">
        Total: $<span id="totalAmount">0.00</span>
    </div>

    <div>
        <button type="submit" class="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
            Complete Sale
        </button>
    </div>
</form>

<script>
    // 🗃️ Product data embedded from backend
    const productData = [
        {% for product in products %}
        {
            id: "{{product.productid}}",
            productcode: "{{ product.productcode }}",
            name: "{{ product.productname }}",
            price: parseFloat("{{ product.price }}"),
            stock: parseInt("{{ product.quantity }}")
        },
        {% endfor %}
    ];

    function findProductByCode(code) {
        return productData.find(p => p.productcode === code);
    }

    function calculateTotal() {
        let total = 0;
        document.querySelectorAll(".sale-item-row").forEach(row => {
            const subtotal = parseFloat(row.querySelector(".product-subtotal").textContent) || 0;
            total += subtotal;
        });
        document.getElementById("totalAmount").textContent = total.toFixed(2);
    }

    function addProductToTable(product) {
        const tbody = document.getElementById("saleItemsBody");

        // Check if product already exists in table
        const existingRow = Array.from(tbody.querySelectorAll(".sale-item-row"))
            .find(row => row.dataset.productcode === product.productcode);

        if (existingRow) {
            const qtyInput = existingRow.querySelector(".quantity-input");
            qtyInput.value = parseInt(qtyInput.value) + 1;
            updateSubtotal(existingRow);
            return;
        }

        const row = document.createElement("tr");
        row.classList.add("sale-item-row");
        row.dataset.productcode = product.productcode;

        row.innerHTML = `
            <td class="px-6 py-4">
                ${product.productcode}
                <input type="hidden" name="product_id[]" value="${product.id}">
            </td>
            <td class="px-6 py-4">${product.name}</td>
            <td class="px-6 py-4 text-right product-price">${product.price.toFixed(2)}</td>
            <td class="px-6 py-4 text-right product-stock">${product.stock}</td>
            <td class="px-6 py-4 text-right">
                <input type="number" name="quantity[]" min="1" value="1"
                    class="quantity-input border border-gray-300 rounded-lg px-2 py-1 w-20">
            </td>
            <td class="px-6 py-4 text-right product-subtotal">${product.price.toFixed(2)}</td>
            <td class="px-6 py-4 text-center">
                <button type="button" class="remove-row text-red-600 hover:text-red-900">
                    <i class="fas fa-times"></i>
                </button>
            </td>
        `;

        tbody.appendChild(row);
        calculateTotal();
    }

    function updateSubtotal(row) {
        const price = parseFloat(row.querySelector(".product-price").textContent);
        const qty = parseInt(row.querySelector(".quantity-input").value);
        const subtotalCell = row.querySelector(".product-subtotal");
        subtotalCell.textContent = (price * qty).toFixed(2);
        calculateTotal();
    }

    // 🔍 Handle barcode (productcode) input
    document.getElementById("barcodeSearch").addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            const code = this.value.trim();
            if (!code) return;

            const product = findProductByCode(code);
            if (product) {
                addProductToTable(product);
                this.value = "";
            } else {
                alert("Product not found!");
            }
        }
    });

    // 🔢 Quantity changes
    document.getElementById("saleItemsBody").addEventListener("input", function (e) {
        if (e.target.classList.contains("quantity-input")) {
            updateSubtotal(e.target.closest(".sale-item-row"));
        }
    });

    // ❌ Remove row
    document.getElementById("saleItemsBody").addEventListener("click", function (e) {
        if (e.target.closest(".remove-row")) {
            e.target.closest(".sale-item-row").remove();
            calculateTotal();
        }
    });
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Add New Stock{% endblock %}

{% block content %}

    <div class="max-w-2xl mx-auto bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100">
        <!-- Header with gradient background -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-white">
            <h2 class="text-3xl font-bold mb-2">Add New Stock</h2>
            <p class="text-blue-100">Fill in the details below to add a new product to your inventory</p>
        </div>

        <!-- Form content -->
        <div class="p-8">
            <form id="addStockForm" method="POST" class="space-y-6">

                <!-- Barcode -->
                <div class="transform transition-all duration-200 hover:scale-[1.01]">
                    <label for="barcode" class="block font-medium mb-2 text-gray-700 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        Barcode
                    </label>
                    <input type="text" id="barcode" name="barcode"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all duration-200 shadow-sm">
                </div>

                <!-- Product Name -->
                <div class="transform transition-all duration-200 hover:scale-[1.01]">
                    <label for="productName" class="block font-medium mb-2 text-gray-700 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        Product Name
                    </label>
                    <input type="text" id="productName" name="productName"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all duration-200 shadow-sm">
                </div>

                <!-- Category -->
                <div class="transform transition-all duration-200 hover:scale-[1.01]">
                    <label for="category" class="block font-medium mb-2 text-gray-700 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                        Category
                    </label>
                    <select id="category" name="category"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all duration-200 shadow-sm appearance-none bg-white">
                        <!-- Options will be populated from database -->
                    </select>
                </div>

                <!-- Description -->
                <div class="transform transition-all duration-200 hover:scale-[1.01]">
                    <label for="description" class="block font-medium mb-2 text-gray-700 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
                        </svg>
                        Description
                    </label>
                    <textarea id="description" name="description"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all duration-200 shadow-sm"
                        rows="3"></textarea>
                </div>

                <!-- Quantity and Price in a grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Quantity -->
                    <div class="transform transition-all duration-200 hover:scale-[1.01]">
                        <label for="quantity" class="block font-medium mb-2 text-gray-700 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                            </svg>
                            Quantity
                        </label>
                        <input type="number" id="quantity" name="quantity" min="0"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all duration-200 shadow-sm">
                    </div>

                    <!-- Price -->
                    <div class="transform transition-all duration-200 hover:scale-[1.01]">
                        <label for="price" class="block font-medium mb-2 text-gray-700 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1" />
                            </svg>
                            Price
                        </label>
                        <input type="number" id="price" name="price" min="0" step="0.01"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all duration-200 shadow-sm">
                    </div>
                </div>

                <!-- Supplier -->
                <div class="transform transition-all duration-200 hover:scale-[1.01]">
                    <label for="supplier" class="block font-medium mb-2 text-gray-700 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                        Supplier
                    </label>
                    <div class="flex items-center space-x-3">
                        <div class="flex-1">
                            <select id="supplier" name="supplier"
                                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all duration-200 shadow-sm appearance-none bg-white">
                                <!-- Options will be populated from database -->
                            </select>
                        </div>
                        <button type="button" id="addSupplierBtn"
                            class="bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white px-5 py-3 rounded-lg font-medium transition-all duration-200 shadow-md hover:shadow-lg flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                            </svg>
                            Add Supplier
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-6">
                    <button type="submit"
                        class="w-full bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white font-bold py-4 px-4 rounded-lg transition-all duration-300 shadow-lg hover:shadow-xl transform hover:-translate-y-1 flex justify-center items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                        </svg>
                        Add New Stock
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script>
        // Example: populate category and supplier dropdown from database (replace with API calls)
        const categories = {{ categorys | tojson}};
        const suppliers = {{ supplys| tojson }};

        const categorySelect = document.getElementById('category');
        const supplierSelect = document.getElementById('supplier');

        categories.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat.cateid;
            option.textContent = cat.title
            categorySelect.appendChild(option);
        });

        suppliers.forEach(sup => {
            const option = document.createElement('option');
            option.value = sup.supplyid;
            option.textContent = sup.nickname;
            supplierSelect.appendChild(option);
        });

        // Add supplier button click
        document.getElementById('addSupplierBtn').addEventListener('click', () => {
            const newSupplier = prompt("Enter new supplier name:");
            if (newSupplier) {
                const option = document.createElement('option');
                option.value = newSupplier;
                option.textContent = newSupplier;
                supplierSelect.appendChild(option);
                supplierSelect.value = newSupplier;
            }
        });

    </script>

{% endblock %}

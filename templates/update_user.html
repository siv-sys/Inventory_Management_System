<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create User - Tailwind Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 font-sans antialiased p-6">
    <div class="max-w-lg mx-auto bg-white rounded-2xl shadow-md p-8">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6">Create New User</h2>

        <form action="{{ url_for('user_mgt.edit_user',id=user.userid) }}" method="POST" class="space-y-6">
            <!-- Name -->
            <div class="space-y-1">
                <label for="nickname" class="block text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" id="nickname" name="nickname" value="{{user.nickname}}" placeholder="Enter full name"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500" />
            </div>

            <!-- Name -->
            <div class="space-y-1">
                <label for="phone" class="block text-sm font-medium text-gray-700">Phone</label>
                <input type="text" id="phone" name="phone" value="{{user.phone}}" placeholder="Enter full phone"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500" />
            </div>

            <!-- Email -->
            <div class="space-y-1">
                <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="email" name="email" value="{{user.email}}" placeholder="Enter email" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500" />
            </div>

            <!-- Password -->
            <div class="space-y-1">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" value="{{user.password}}"
                    placeholder="Enter password" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500" />
            </div>

            <!-- level -->
            <div class="space-y-1">
                <label for="level" class="block text-sm font-medium text-gray-700">Role</label>
                <select id="level" name="level" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Select level</option>
                    <option value="Admin" {% if user.level=='Admin' %}selected{% endif %}>Admin</option>
                    <option value="User" {% if user.level=='User' %}selected{% endif %}>User</option>
                </select>
            </div>

            <!-- user_disable -->
            <div class="space-y-1">
                <label for="user_disable" class="block text-sm font-medium text-gray-700">Status</label>
                <select id="user_disable" name="user_disable" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    <option value="0" {% if user.user_disable==0 %}selected{% endif %}>Active</option>
                    <option value="1" {% if user.user_disable==1 %}selected{% endif %}>InActive</option>
                </select>
            </div>

            <!-- Submit Button -->
            <div class="pt-4">
                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors">
                    Update User
                </button>
            </div>
        </form>
    </div>
</body>

</html>
